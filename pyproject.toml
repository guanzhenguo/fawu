[project]
name = "fawu"
version = "0.1.0"
description = "Contract lifecycle management and legal review platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "celery>=5.6,<6",
  "django>=5.2.17,<5.3",
  "django-cors-headers>=4.7,<5",
  "djangorestframework>=3.15,<4",
  "fastapi>=0.116,<1",
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pymysql>=1.1,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]
word = ["aspose-words>=25,<27"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fawu.settings"
pythonpath = ["backend", "."]
testpaths = ["backend/apps", "services"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["backend/apps/contracts/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["B008", "DJ001", "DJ008", "DJ012"]
